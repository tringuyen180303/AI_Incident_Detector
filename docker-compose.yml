x-python: &python
  build: .
  environment:
    KAFKA_BROKERS: broker:19092
    DATABASE_URL: postgresql://aid:aid@postgres:5432/aid
    SUPABASE_URL: ${SUPABASE_URL:-}
    SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-nano}
    NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
    TELEMETRY_PARTITIONS: ${TELEMETRY_PARTITIONS:-12}
    ANOMALY_PARTITIONS: ${ANOMALY_PARTITIONS:-3}
  depends_on:
    - broker
    - postgres
  restart: unless-stopped

services:
  broker:
    image: apache/kafka:4.1.0
    hostname: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aid
      POSTGRES_PASSWORD: aid
      POSTGRES_DB: aid
    ports:
      - "5433:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aid -d aid"]
      interval: 5s
      timeout: 5s
      retries: 20

  collector:
    image: otel/opentelemetry-collector-contrib:0.147.0
    depends_on:
      - broker
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped

  produce:
    <<: *python
    command: python -m aid.produce

  normalize:
    <<: *python
    command: python -m aid.normalize

  detect:
    <<: *python
    command: python -m aid.detect

  engine:
    <<: *python
    command: python -m aid.engine

  notify-board:
    <<: *python
    command: python -m aid.notify board

  notify-webhook:
    <<: *python
    command: python -m aid.notify webhook

  api:
    <<: *python
    command: python -m aid.api
    ports:
      - "8080:8080"
