# Apps and agents send OTLP here. The collector writes Kafka.
# It does not write Supabase.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  hostmetrics:
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true

processors:
  batch:
    timeout: 2s
    send_batch_size: 200

exporters:
  kafka:
    brokers:
      - broker:19092
    logs:
      topic: otlp.logs
      encoding: otlp_json
    metrics:
      topic: otlp.metrics
      encoding: otlp_json
    traces:
      topic: otlp.traces
      encoding: otlp_json
    producer:
      max_message_bytes: 8000000

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [kafka]
    metrics:
      receivers: [otlp, hostmetrics]
      processors: [batch]
      exporters: [kafka]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [kafka]
